<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · FleteRuta</title><link rel="stylesheet" href="/app.css"><script type="module" src="/login.js"></script></head><body class="auth-app"><header><a class="brand" href="/login">↗ FleteRuta <small>TEST 0.3</small></a><span>Acceso privado</span></header><main class="login-layout"><section><span class="eyebrow">TU REPARTO EMPIEZA ACÁ</span><h1>Todo listo.<br>Entrá y organizá.</h1><p>El acceso está reservado al usuario autorizado.</p></section><section class="panel login-panel"><h2 id="login-title">Iniciar sesión</h2><p id="login-description">Ingresá con tu usuario y contraseña.</p><form id="login-form"><div id="signup-name-wrap" hidden><label for="full-name">Nombre y apellido</label><input id="full-name" autocomplete="name" minlength="2" maxlength="100"></div><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9_.-]+"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><div id="confirm-wrap" hidden><label for="confirm-password">Repetir contraseña</label><input id="confirm-password" type="password" autocomplete="new-password" maxlength="128"></div><div id="mfa-wrap" hidden><label for="mfa-code">C&#243;digo del autenticador</label><input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6"></div><button id="submit-login" class="primary wide">Ingresar</button><p id="login-message" class="help" role="status" aria-live="polite"></p></form><button id="toggle-signup" class="wide" type="button" hidden>Crear cuenta</button><p class="help">Sin registro público. La sesión vence a las 8 horas o al reiniciar el servidor.</p></section></main></body></html>
